<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>IPES Staff Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }
    .iframe-crop-box {
      position: absolute;
      /* Shifts the container down by 38px to hide the Google bar, while expanding height to prevent cutting off the bottom */
      top: 0px;
      left: 0;
      width: 100%;
      height: calc(100% + 38px);
      overflow: hidden;
    }
    .iframe-crop-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-crop-box">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbzizqf1qaYhnA8W8KEkJSQHphe3NVj394uESTZxZMTY7qK71QRIKwhXIgtyBkRc8vymMA/exec" 
      allow="camera *; microphone *; geolocation *; clipboard-write *; fullscreen *">
    </iframe>
  </div>
</body>
</html>
